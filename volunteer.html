<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Application - Twin Cities Animal Rescue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Twin Cities Animal Rescue</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="programs.html">About & Programs</a>
            <a href="volunteer.html" class="active">Volunteer / Foster</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>Get Involved</h1>
            <p>Thank you for your interest in joining our efforts. Your time, passion, and skills can truly change lives in our local neighborhood.</p>
        </div>

        <section class="content">
            <h2>Application Form</h2>
            
            <form class="application-form" action="#">
                <p>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
                </p>

                <p>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </p>

                <p>
                    <label for="interest">Area of Interest:</label>
                    <select id="interest" name="interest" required>
                        <option value="">--Please choose an option--</option>
                        <option value="volunteer">Volunteer Placement</option>
                        <option value="foster">Pet Fostering</option>
                        <option value="both">Both Programs</option>
                    </select>
                </p>

                <p>
                    <label for="comments">Tell us a bit about yourself:</label>
                    <textarea id="comments" name="comments" rows="5" required placeholder="Please tell us a bit about your background (minimum 15 characters required)..."></textarea>
                </p>

                <button type="submit">Submit Application</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Twin Cities Animal Rescue. All Rights Reserved.</p>
    </footer>

    <script>
    const applicationDraft = { name: "", email: "", preference: "", experience: "" };
    const STORAGE_KEY = "tcar_volunteer_draft";
    let form, nameInput, emailInput, prefSelect, expTextArea, dynamicFeedback;

    document.addEventListener("DOMContentLoaded", () => {
        form = document.querySelector('form.application-form') || document.querySelector('form');
        if (!form) return;
        form.setAttribute("novalidate", true);

        nameInput = document.getElementById("fullname");
        emailInput = document.getElementById("email");
        prefSelect = document.getElementById("interest");
        expTextArea = document.getElementById("comments");

        dynamicFeedback = document.createElement("div");
        dynamicFeedback.style.marginTop = "-10px";
        dynamicFeedback.style.marginBottom = "15px";
        dynamicFeedback.style.fontWeight = "bold";
        dynamicFeedback.style.color = "#2b6cb0";
        if (prefSelect && prefSelect.parentNode) {
            prefSelect.parentNode.insertBefore(dynamicFeedback, prefSelect.nextSibling);
        }

        form.addEventListener("input", (event) => {
            const target = event.target;
            if (!target) return;
            if (target === nameInput) applicationDraft.name = target.value;
            if (target === emailInput) applicationDraft.email = target.value;
            if (target === prefSelect) applicationDraft.preference = target.value;
            if (target === expTextArea) applicationDraft.experience = target.value;

            clearFieldError(target);
            if ((target === nameInput || target === emailInput) && target.value.trim().length > 0) {
                target.style.borderColor = "#28a745";
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(applicationDraft));
        });

        if (prefSelect) {
            prefSelect.addEventListener("change", () => {
                if (prefSelect.value === "foster") {
                    dynamicFeedback.textContent = "🐾 Excellent choice! Our Animal Foster Care Program requires a separate home check orientation.";
                    dynamicFeedback.style.display = "block";
                } else {
                    dynamicFeedback.textContent = "";
                    dynamicFeedback.style.display = "none";
                }
            });
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            let isFormValid = true;

            if (nameInput && nameInput.value.trim() === "") {
                showFieldError(nameInput, "Full Name is required.");
                isFormValid = false;
            }
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailInput && !emailRegex.test(emailInput.value.trim())) {
                showFieldError(emailInput, "Please enter a valid email address (e.g., name@example.com).");
                isFormValid = false;
            }
            if (prefSelect && prefSelect.value === "") {
                showFieldError(prefSelect, "Please select an Area of Interest.");
                isFormValid = false;
            }
            if (expTextArea && expTextArea.value.trim().length < 15) {
                showFieldError(expTextArea, "Please tell us a bit more about your background (minimum 15 characters required).");
                isFormValid = false;
            }

            if (isFormValid) {
                displaySuccessModal();
            }
        });

        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const data = JSON.parse(saved);
            Object.assign(applicationDraft, data);
            if (nameInput && data.name) { nameInput.value = data.name; nameInput.style.borderColor = "#28a745"; }
            if (emailInput && data.email) { emailInput.value = data.email; emailInput.style.borderColor = "#28a745"; }
            if (prefSelect && data.preference) { prefSelect.value = data.preference; prefSelect.dispatchEvent(new Event("change")); }
            if (expTextArea && data.experience) expTextArea.value = data.experience;
        }
    });

    function showFieldError(inputElement, message) {
        clearFieldError(inputElement);
        inputElement.style.borderColor = "#dc3545";
        const errorDiv = document.createElement("div");
        errorDiv.className = "field-error-msg";
        errorDiv.style.color = "#dc3545";
        errorDiv.style.fontSize = "0.9em";
        errorDiv.style.fontWeight = "bold";
        errorDiv.style.marginTop = "-15px";
        errorDiv.style.marginBottom = "15px";
        errorDiv.textContent = message;
        inputElement.parentNode.insertBefore(errorDiv, inputElement.nextSibling);
    }

    function clearFieldError(inputElement) {
        if (!inputElement) return;
        inputElement.style.borderColor = "";
        const errorMsg = inputElement.parentNode.querySelector(".field-error-msg");
        if (errorMsg) inputElement.parentNode.removeChild(errorMsg);
    }

    function displaySuccessModal() {
        const travelerName = nameInput ? nameInput.value.trim() : "Volunteer";
        const modalOverlay = document.createElement("div");
        modalOverlay.style.cssText = "position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center;z-index:9999;";

        const modalContent = document.createElement("div");
        modalContent.style.cssText = "background:#f7f9fa;padding:30px;border-radius:8px;max-width:500px;width:90%;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.3);font-family:Arial,sans-serif;";

        modalContent.innerHTML = `
            <h2 style="color:#1a365d;margin-bottom:15px;">Application Saved!</h2>
            <p style="color:#2d3748;line-height:1.5;">Thank you, <strong>${travelerName}</strong>! Your application details have been recorded locally. Our onboarding system is tracking this setup properly.</p>
            <button id="closeModalBtn" style="margin:20px auto 0;display:block;padding:10px 20px;background:#2b6cb0;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;">Return to Site</button>
        `;

        modalOverlay.appendChild(modalContent);
        document.body.appendChild(modalOverlay);

        document.getElementById("closeModalBtn").addEventListener("click", () => {
            document.body.removeChild(modalOverlay);
            form.reset();
            localStorage.removeItem(STORAGE_KEY);
            if (nameInput) nameInput.style.borderColor = "";
            if (emailInput) emailInput.style.borderColor = "";
            if (dynamicFeedback) dynamicFeedback.style.display = "none";
        });
    }
    </script>
</body>
</html>
